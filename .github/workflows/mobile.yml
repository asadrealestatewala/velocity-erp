name: Mobile builds

on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**", "ios/**", "capacitor.config.ts", "mobile/**", ".github/workflows/mobile.yml"]

env:
  # Production origin the native shell loads. Set the repo variable VELOCITY_APP_URL.
  VELOCITY_APP_URL: ${{ vars.VELOCITY_APP_URL }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: velocity-android-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync ios
      # Unsigned simulator build proves the project compiles. Store builds need signing (see docs/MOBILE.md).
      - run: >
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
